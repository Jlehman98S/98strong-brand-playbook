<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Brand Playbook</title>
<link rel="icon" href="favicon.png">
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--panel:#151515;--cream:#f7ecdc;--gold:#d9a330;--text:#f4efe7;--muted:#a9a29a;--line:#2a2a2a;--ink:#141414;--ok:#7fc79a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,sans-serif}
h1,h2,h3,.disp{font-family:"Barlow Condensed",Impact,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin:0}
header{position:sticky;top:0;z-index:5;background:rgba(11,11,11,.95);border-bottom:1px solid var(--line)}
.bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{height:38px;width:auto;display:block}
.who{margin-left:auto;color:var(--muted);font-size:13px;text-align:right;line-height:1.3}
.who a{color:var(--gold);cursor:pointer}
nav{max-width:920px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;overflow-x:auto}
nav button{flex:1;min-width:96px;background:var(--panel);color:var(--muted);border:1px solid var(--line);padding:7px 10px;border-radius:4px;cursor:pointer;font:inherit;font-size:12px;text-align:left}
nav button .disp{display:block;font-size:19px;color:var(--text)}
nav button[aria-current=true]{border-color:var(--gold);background:#1d1709}
nav button[aria-current=true] .disp{color:var(--gold)}
nav button:disabled{opacity:.45;cursor:default}
main{max-width:920px;margin:0 auto;padding:20px 16px 90px}
.hero{padding:22px 0 6px}
.eyebrow{color:var(--gold);font:italic 800 15px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em}
.hero h1{font-size:clamp(46px,10vw,80px);line-height:.95;margin:6px 0}
.hero p{color:var(--muted);font-weight:300;font-size:19px;margin:6px 0 12px}
.rule{height:2px;background:var(--gold);width:min(420px,100%);margin:14px 0}
.agenda{display:grid;gap:4px;font-size:14px}.agenda b{display:inline-block;min-width:92px}
.card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:4px;padding:22px;margin:22px 0}
.card.cream{background:var(--cream);color:var(--ink);border-color:var(--cream);border-top-color:var(--gold)}
.card.cream .hint,.card.cream label .sub,.card.cream .status{color:#6b625a}
.card h2{font-size:32px;line-height:1}
.num{color:var(--gold);font-size:15px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 14px}
.field{margin:16px 0}
label{display:block;font-weight:600;margin-bottom:6px}
label .sub{display:block;font-weight:400;font-size:13px;color:var(--muted)}
textarea,input[type=text],input[type=email],input[type=date],input[type=url],input[inputmode=numeric],select{width:100%;background:#0f0f0f;color:var(--text);border:1px solid #333;border-radius:4px;padding:10px 12px;font:inherit}
.cream textarea,.cream input,.cream select{background:#fffaf2;color:var(--ink);border-color:#d8c9b2}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{font-weight:400;margin:0;cursor:pointer;border:1px solid #3a3a3a;border-radius:999px;padding:7px 14px;user-select:none;position:relative}
.cream .chips label{border-color:#cdbb9f}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--gold);color:#111;border-color:var(--gold);font-weight:600}
.chips label:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.example{border-left:3px solid var(--gold);padding:8px 14px;margin:12px 0;font-style:italic;color:var(--muted)}
.cream .example{color:#5b534b}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{background:#0f0f0f;border:1px solid #2f2f2f;border-radius:4px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:1/1;background:#191919;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:13px;text-align:center;border-bottom:1px solid #2f2f2f}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .n{position:absolute;top:6px;left:8px;font:italic 800 20px "Barlow Condensed";color:var(--gold);text-shadow:0 1px 3px #000}
.ph .plus{font:italic 800 34px "Barlow Condensed";color:var(--gold);display:block}
.ph input{display:none}
.tile .body{padding:8px;display:grid;gap:6px}
.tile select,.tile input[type=text]{padding:7px 9px;font-size:14px}
.count{font:italic 800 22px "Barlow Condensed";color:var(--gold)}
.btn{background:var(--gold);color:#111;border:0;border-radius:4px;padding:11px 18px;font:italic 800 18px "Barlow Condensed",sans-serif;text-transform:uppercase;cursor:pointer;letter-spacing:.03em}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn.done{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:13px;color:var(--muted)}
.private{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:6px}
.cream .private{color:#8a5f10}
.fill{display:grid;gap:10px}
.fill .line{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fill .line input{flex:1;min-width:170px}
.join{max-width:500px;margin:4vh auto}
.tabs{display:flex;gap:6px;margin-bottom:-1px}
.tabs button{background:none;border:1px solid var(--line);border-bottom:none;color:var(--muted);padding:8px 14px;border-radius:4px 4px 0 0;cursor:pointer;font:inherit;font-size:14px}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--gold);border-color:var(--gold)}
.err{color:#ff8a7a;font-size:14px;min-height:20px}
.pill{position:fixed;right:14px;bottom:14px;background:#1b1b1b;border:1px solid var(--line);color:var(--muted);font-size:12px;padding:6px 12px;border-radius:999px;z-index:9}
.pill.ok{color:var(--ok);border-color:#2f4a39}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:var(--gold);color:#111;padding:10px 18px;border-radius:4px;font-weight:600;display:none;z-index:10;max-width:90vw}
.wall{columns:3 240px;column-gap:14px}
.post{break-inside:avoid;background:var(--panel);border:1px solid var(--line);border-radius:4px;margin:0 0 14px;overflow:hidden}
.post img{width:100%;display:block}
.post .pb{padding:12px 14px}
.post .k{font:italic 800 14px "Barlow Condensed";color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
.post .t{white-space:pre-wrap;margin:4px 0 8px}
.post .by{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center}
.post.hidden{opacity:.4}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px;padding:0}
.present .post .t{font-size:22px}.present .wall{columns:3 320px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--gold);font:italic 800 15px "Barlow Condensed";text-transform:uppercase}
.mat{display:grid;gap:6px}
.mat .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.mat a,.matlink{color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:40px 10px;border:1px dashed var(--line);border-radius:4px}
.lock{font-size:13px;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 16px}
@media (max-width:560px){.card{padding:16px}.who .meta{display:none}.logo{height:32px}table{font-size:13px}.hide-sm{display:none}}
</style>
</head>

const GAS = typeof google!=="undefined" && google.script && google.script.run;
const API_URL = (window.PLAYBOOK_API_URL||"").trim();
const LIVE = GAS || !!API_URL;
async function api(fn,...args){
  if(GAS) return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message||e)))[fn](...args));
  if(API_URL){let r;
    try{r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,args})}).then(x=>x.json())}
    catch(e){throw new Error("Can't reach 98Strong right now. Check your connection and try again.")}
    if(!r.ok)throw new Error(r.error||"Something went wrong.");return r.data}
  return new Promise((res,rej)=>setTimeout(()=>{try{res(MOCK[fn](...args))}catch(e){rej(e)}},150));
}

   login:(e,pin)=>{const a=d.athletes.find(x=>x.email===String(e).toLowerCase());if(!a)throw new Error("We could not find you. Join with your name and email first.");return sess(auth(a.id,pin))},
   saveAnswers:(id,pin,s,ans)=>{auth(id,pin);(d.data[id]=d.data[id]||{})[s]=ans;d.athletes.find(x=>x.id===id).last=new Date().toISOString();w();return{savedAt:new Date().toISOString()}},
   uploadPhoto:(id,pin,url)=>{auth(id,pin);return{id:url}},
   postToWall:(id,pin,kind,text,photoId)=>{const a=auth(id,pin);d.wall.unshift({id:Math.random().toString(36).slice(2),time:new Date().toISOString(),athleteId:id,name:a.name,kind,text,photoId,hidden:false});w();return{}},

function flatten(sid){const out={},sess=SESSIONS.find(x=>x.id===sid);
  sess.steps.forEach((st,si)=>st.fields.forEach(f=>{const v=ans(sid,f.id);const col=`${si+1}. ${f.label||st.title}`;let t="";

    else if(f.type==="list")t=v.filter(Boolean).map((x,i)=>`${i+1}. ${x}`).join("\n");

async function uploadTile(sid,i,file){
  const ph=document.querySelector(`[data-ph="${i}"]`);ph.querySelector("span")&&(ph.querySelector("span").innerHTML="Uploading…");
  try{const url=await shrink(file,1280,.82);
    const prev=ph.querySelector("img")||document.createElement("img");prev.src=url;prev.alt="";if(!prev.parentNode)ph.prepend(prev);ph.querySelector("span:not(.n)")?.remove();
    const r=await api("uploadPhoto",S.me.id,S.pin,url,"Mood board "+(i+1));
    const b=(ans(sid,"board")||[]).slice();while(b.length<=i)b.push({});b[i]={...(b[i]||{}),photo:r.id};setAns(sid,"board",b);updateBoardUI(b,i);toast("Photo added")}
  catch(e){toast("Upload failed: "+e.message);render()}}
function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",q))};
  img.onerror=()=>rej(new Error("That file type isn't supported. Try a JPG or PNG screenshot."));img.src=u})}

  $("#app").innerHTML=`<section class="hero"><div class="eyebrow">Host view · keep this link private</div><h1>Session control</h1><div class="rule"></div>
   <div class="row">${H.sheetUrl?`<a class="btn ghost" href="${esc(H.sheetUrl)}" target="_blank">Open response Sheet</a>`:""}<button class="btn" id="pres">Present group wall</button><button class="btn ghost" id="ref">Refresh</button></div></section>
  <section class="card"><h2>Open sessions</h2><p class="hint">Athletes can only open the sessions you turn on.</p><div class="chips">${SESSIONS.map(s=>`<label><input type="checkbox" data-open="${s.id}" ${H.open.includes(s.id)?"checked":""}>Session ${s.n} · ${s.name}</label>`).join("")}</div></section>
  <section class="card"><h2>Athletes (${H.athletes.length})</h2><p class="hint">Progress = fields answered. Upload each athlete's documents when they're ready and they'll appear in that athlete's My Playbook tab.</p>
   ${H.athletes.length?`<div style="overflow-x:auto"><table><thead><tr><th>Athlete</th>${SESSIONS.map(s=>`<th class="hide-sm">${s.name}</th>`).join("")}<th>Documents</th></tr></thead><tbody>
   ${H.athletes.map(a=>`<tr><td><b>${esc(a.name)}</b><div class="status">${esc(a.sport)} · ${esc(a.school)}${a.handle?"<br>"+esc(a.handle):""}<br>${a.lastActive?"Active "+new Date(a.lastActive).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}):""}</div></td>
     ${SESSIONS.map(s=>`<td class="hide-sm">${(a.progress||{})[s.id]||0} / ${sessionCount(s.id)}</td>`).join("")}
     <td><div class="mat">${MATERIALS.map(([k,t])=>`<div class="m">${a.materials[k]?`<a href="${esc(a.materials[k])}" target="_blank">${t} ✓</a>`:`<span class="status">${t}</span>`}
       <label class="btn sm ghost" style="margin:0">Upload<input type="file" hidden data-mat="${k}" data-a="${esc(a.id)}"></label><button class="linkbtn" data-link="${k}" data-a="${esc(a.id)}">or paste link</button></div>`).join("")}</div></td></tr>`).join("")}
   </tbody></table></div>`:`<div class="empty">No one has joined yet. Share the site link (without ?host=…).</div>`}</section>
  <section class="card"><h2>Group wall</h2><p class="hint">Hide anything that shouldn't be on screen. Hidden posts stay in the Sheet.</p>${H.wall.length?`<div class="wall">${H.wall.map(p=>postHTML(p,{host:true})).join("")}</div>`:`<div class="empty">Nothing shared yet.</div>`}</section>`;
  $("#ref").onclick=renderHost;$("#pres").onclick=()=>{present=true;renderHost()};
  document.querySelectorAll("[data-open]").forEach(c=>c.onchange=async()=>{const l=[...document.querySelectorAll("[data-open]:checked")].map(x=>x.dataset.open);await api("hostSetOpen",hostKey,l);toast("Updated. Athletes see it when they refresh.")});
  document.querySelectorAll("[data-hide]").forEach(b=>b.onclick=async()=>{await api("hostSetHidden",hostKey,b.dataset.hide,b.dataset.h==="1");renderHost()});
  document.querySelectorAll("[data-mat]").forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;if(f.size>15e6){toast("15 MB max");return}
    toast("Uploading…");const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
    try{await api("hostSetMaterial",hostKey,inp.dataset.a,inp.dataset.mat,url,f.name,"");toast("Uploaded");renderHost()}catch(e){toast(e.message)}});
  document.querySelectorAll("[data-link]").forEach(b=>b.onclick=async()=>{const l=prompt("Paste a Google Drive or other link");if(!l)return;await api("hostSetMaterial",hostKey,b.dataset.a,b.dataset.link,"","",l);renderHost()});
}
let presTimer=null;
async function renderPresent(){
  document.body.classList.add("present");
  const draw=async()=>{try{H=await api("hostOverview",hostKey)}catch(e){return}const posts=H.wall.filter(p=>!p.hidden);
    $("#app").innerHTML=`<section class="hero" style="padding-top:6px"><div class="row" style="justify-content:space-between"><h1 style="font-size:54px">Group wall</h1><button class="btn ghost sm" id="exit">Exit</button></div><div class="rule"></div></section>
    ${posts.length?`<div class="wall">${posts.map(p=>postHTML(p)).join("")}</div>`:`<div class="empty">Waiting for the first share…</div>`}`;
    $("#exit").onclick=()=>{present=false;clearInterval(presTimer);document.body.classList.remove("present");renderHost()}};
  await draw();clearInterval(presTimer);presTimer=setInterval(draw,5000)}
</script>
</body>
